<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>권은산 대통령 국정 운영 시뮬레이터</title>
  <style>
    body { font-family: 'Pretendard', -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; height: 90vh; }
    .header { text-align: center; border-bottom: 2px solid #334155; padding-bottom: 10px; margin-bottom: 20px; }
    .header h1 { margin: 0; color: #38bdf8; font-size: 1.5rem; }
    .chat-box { flex: 1; overflow-y: auto; background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid #334155; }
    .message { margin-bottom: 20px; line-height: 1.6; white-space: pre-wrap; }
    .message.user { color: #38bdf8; font-weight: bold; text-align: right; background: #0284c722; padding: 10px 15px; border-radius: 8px; }
    .message.assistant { color: #f1f5f9; background: #33415544; padding: 15px; border-radius: 8px; border-left: 4px solid #38bdf8; }
    .input-box { display: flex; gap: 10px; }
    input[type="text"] { flex: 1; padding: 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; }
    button { padding: 14px 24px; border-radius: 8px; border: none; background: #0284c7; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🇰🇷 대한민국 제21대 대통령 권은산 국정 상황실</h1>
    </div>
    <div class="chat-box" id="chatBox">
      <div class="message assistant">대통령님, 비상계엄 선포 및 전시 통수권 행사에 관한 국정 상황실이 연결되었습니다. 다음 지시를 내려주십시오.</div>
    </div>
    <div class="input-box">
      <input type="text" id="userInput" placeholder="대통령으로서 수행할 지시를 입력하세요..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button id="sendBtn" onclick="sendMessage()">지시 하달</button>
    </div>
  </div>

  <script>
    const messages = [];

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const btn = document.getElementById('sendBtn');
      const text = input.value.trim();
      
      if (!text) return;

      input.value = '';
      input.disabled = true;
      btn.disabled = true;

      appendMessage('user', `[권은산 대통령]: ${text}`);
      messages.push({ role: 'user', content: text });

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });

        const data = await res.json();
        if (data.message) {
          appendMessage('assistant', data.message.content);
          messages.push(data.message);
        } else {
          appendMessage('assistant', '오류가 발생했습니다: ' + (data.error || '알 수 없는 오류'));
        }
      } catch (err) {
        appendMessage('assistant', '서버 통신 실패.');
      } finally {
        input.disabled = false;
        btn.disabled = false;
        input.focus();
      }
    }

    function appendMessage(role, text) {
      const chatBox = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
